apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-node-exporter-discovery
  namespace: monitoring

rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-node-exporter-discovery
  namespace: monitoring

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-node-exporter-discovery

subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring