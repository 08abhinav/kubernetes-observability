apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # Prometheus monitors itself.
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      # Discover application pods through Kubernetes API.
      - job_name: observability-app

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - observability

        relabel_configs:

          # Only scrape pods with prometheus.io/scrape=true.
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"

          # Only scrape running pods.
          - source_labels:
              - __meta_kubernetes_pod_phase
            action: keep
            regex: Running

          # Read the metrics path from the annotation.
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # Build the scrape address from pod IP and port.
          - source_labels:
              - __meta_kubernetes_pod_ip
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2

          # Add useful labels to the scraped metrics.
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app
      

      - job_name: kubernetes-nodes-cadvisor

        kubernetes_sd_configs:
          - role: node

        scheme: https

        metrics_path: /metrics/cadvisor

        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring.svc.cluster.local:8080

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: node-exporter

          - source_labels:
              - __meta_kubernetes_pod_phase
            action: keep
            regex: Running

          - source_labels:
              - __meta_kubernetes_pod_ip
            target_label: __address__
            replacement: $1:9100
            regex: (.+)

          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
              